# Disposable sandbox workflow (synthetic data only).
#
# Workflow B (pull_request): record the real pull_request payload (reduced + shape), run the synthetic tests, upload
# junit.xml / meta.json. UNTRUSTED by design: it runs the PR's own code with a read-only token and NO secrets. The
# artifact it produces is treated as DATA by everything downstream (never executed, never trusted as proof).
# Fork PRs are NOT filtered out here on purpose: a fork PR (optional trial, needs a second account) must still be
# recorded; GitHub gives such runs no secrets and a read-only token, and this workflow has no secrets anyway.
name: sb-b-pr-event
on:
  pull_request:
    types: [opened]                          # Stage 2: `opened` only (no reopened / synchronize / labeled); no pull_request_target anywhere
    branches: [main]
permissions: {}

concurrency:
  group: sb-b-${{ github.event.pull_request.number }}
  cancel-in-progress: true                  # an older run of the same PR is worthless; (no `queue:` key: cannot be combined)

jobs:
  capture-and-test:
    if: vars.SB_ENABLED == 'true'           # kill switch (the variable may be unavailable to fork runs: then the job is skipped)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read                         # only for the run-count guard
    steps:
      - name: Run-count guard (program-side budget; runs before any PR code)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_RUNS: ${{ vars.SB_MAX_RUNS }}
        run: |
          set -euo pipefail
          MAX="${MAX_RUNS:-5}"
          [[ "$MAX" =~ ^[0-9]{1,3}$ ]] || { echo "::error::bad SB_MAX_RUNS"; exit 1; }
          TOTAL="$(gh api "repos/$REPO/actions/runs?per_page=1" --jq '.total_count')"
          [[ "$TOTAL" =~ ^[0-9]+$ ]] || { echo "::error::cannot read the run count"; exit 1; }
          echo "total_runs=$TOTAL max=$MAX"
          [ "$TOTAL" -le "$MAX" ] || { echo "::error::run budget exceeded"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.x, pinned by `sandbox_kit build --pin`
        with:
          ref: ${{ github.event.pull_request.head.sha }}   # the head commit itself, not the merge commit
          persist-credentials: false
      - name: Capture the event BEFORE any PR code runs (values only through environment variables)
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_NUMBER: ${{ github.run_number }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_ACTION: ${{ github.event.action }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OUT: ${{ runner.temp }}/sb-b
        run: |
          set -euo pipefail
          python3 tools/capture.py context --out-dir "$OUT"
          python3 tools/capture.py event --kind pull_request --event-file "$GITHUB_EVENT_PATH" --out-dir "$OUT"
      - name: Run the synthetic tests (the exit code is kept; the artifact is uploaded either way)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUT: ${{ runner.temp }}/sb-b
        run: |
          set -u
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check -q pytest==8.4.2
          set +e
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q -p no:cacheprovider --junitxml="$OUT/junit.xml"
          RC=$?
          set -e
          printf '{"pr": %s, "head_sha": "%s", "exit_code": %s}\n' "$PR_NUMBER" "$HEAD_SHA" "$RC" > "$OUT/meta.json"
          exit "$RC"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.x, pinned by `sandbox_kit build --pin`
        if: always()
        with:
          name: sb-b-pr-event
          path: ${{ runner.temp }}/sb-b/
          if-no-files-found: error
          retention-days: 1
